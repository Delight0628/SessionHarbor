name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "发布 tag（例如 v0.2.0）；留空则使用 run id"
        required: false
        default: ""

permissions:
  contents: write

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "0"

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            artifact: sessionharbor-win-x64
          - os: macos-latest
            platform: darwin
            artifact: sessionharbor-mac
          - os: ubuntu-latest
            platform: linux
            artifact: sessionharbor-linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 版本与根 package.json 的 packageManager 保持一致

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Pack ${{ matrix.platform }}
        shell: bash
        run: |
          set -e
          DIST=$(find node_modules -path '*/electron/dist' -type d 2>/dev/null | head -1 || true)
          if [ -z "$DIST" ]; then
            ELEC=$(find node_modules -path '*/electron/install.js' 2>/dev/null | head -1 || true)
            if [ -n "$ELEC" ]; then node "$ELEC"; fi
          fi
          node scripts/pack-desktop.mjs
          ls -la release/artifacts || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/artifacts/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-assets
          merge-multiple: true

      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(node -p "require('./package.json').version")-ci.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Assets:"
          ls -la dist-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          TAG="${{ steps.meta.outputs.tag }}"
          NOTES="SessionHarbor multi-platform build from \`${{ github.sha }}\`.

          | 平台 | 产物 |
          |---|---|
          | Windows x64 | \`SessionHarbor-*-win-x64.exe\` |
          | macOS | \`SessionHarbor-*-mac-{x64,arm64}.{dmg,zip}\` |
          | Linux x64 | \`SessionHarbor-*-linux-x64.{AppImage,tar.gz}\` |

          > macOS 未签名：首次打开请右键 → 打开，或 \`xattr -dr com.apple.quarantine /Applications/SessionHarbor.app\`"
          mapfile -t FILES < <(find dist-assets -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.tar.gz' \) ! -name '*blockmap*')
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No release assets found"; ls -laR dist-assets; exit 1
          fi
          printf 'Uploading:\n'; printf '  %s\n' "${FILES[@]}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --title "SessionHarbor $TAG" \
              --notes "$NOTES"
          fi
