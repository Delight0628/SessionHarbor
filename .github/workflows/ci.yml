name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Diagnose
        run: |
          echo "node=$(node -v) pnpm=$(pnpm -v)"
          echo "packageManager=$(node -p "require('./package.json').packageManager")"
          ls packages/adapters

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: |
          pnpm --filter @sessionharbor/core build
          pnpm --filter "@sessionharbor/adapter-*" build
          pnpm --filter @sessionharbor/cli build
          pnpm --filter @sessionharbor/cloud-server build
          pnpm --filter @sessionharbor/desktop build

      - name: Unit tests
        run: pnpm unit

      - name: E2E
        run: pnpm e2e
