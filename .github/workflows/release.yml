name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "发布 tag（例如 v0.2.0）；留空则使用 run id"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 版本与根 package.json 的 packageManager 保持一致（pnpm@11.15.1）

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Pack portable exe
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "0"
        run: node scripts/pack-desktop.mjs

      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(node -p "require('./package.json').version")-ci.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          ls -la SessionHarbor.exe

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          NOTES="SessionHarbor portable build from \`${{ github.sha }}\`."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" SessionHarbor.exe --clobber
          else
            gh release create "$TAG" SessionHarbor.exe \
              --title "SessionHarbor $TAG" \
              --notes "$NOTES"
          fi
