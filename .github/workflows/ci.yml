name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          pnpm --filter @sessionharbor/core build
          pnpm --filter "@sessionharbor/adapter-*" build
          pnpm --filter @sessionharbor/cli build
          pnpm --filter @sessionharbor/cloud-server build
          pnpm --filter @sessionharbor/desktop build

      - name: Unit tests
        run: pnpm unit

      - name: E2E
        run: pnpm e2e
